name: Validar pull request

on:
  pull_request:
    branches:
      - main
      - "style/**"
      - "infra/**"
      - "db/**"
      - "auth/**"

permissions:
  contents: read

concurrency:
  group: validar-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Verificar TypeScript
        run: npm run typecheck
      - name: Testar regras e exportacao XLSX
        run: npm run test:rules
      - name: Verificar cliente Supabase server-only sem dados reais
        if: ${{ github.event.pull_request.head.ref == 'infra/supabase-cloud-45' }}
        run: node scripts/testar-cliente-supabase-cloud.cjs
      - name: Verificar base de sessao Supabase SSR
        if: ${{ github.event.pull_request.head.ref == 'auth/supabase-ssr-47' }}
        run: node scripts/testar-sessao-supabase-ssr.cjs
      - name: Compilar sistema
        run: npm run build
        env:
          NEXT_PUBLIC_DEPLOY_TARGET: github-pages
          NEXT_PUBLIC_BASE_PATH: /excelencia-5-estrelas-2027
      - name: Instalar navegador para regressao visual
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Verificar desktop e celular
        run: |
          node scripts/testar-ajustes-browser.cjs
          node scripts/testar-fundacao-admin-browser.cjs
          npm run test:entrada
          npm run test:cinema
      - name: Salvar evidencias visuais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ajustes-desktop-celular
          path: artifacts/

      - name: Validar homologacao Docker e Next.js servidor
        # Executa contêineres efêmeros somente no runner do GitHub, sem acesso ao servidor do setor.
        if: ${{ github.event.pull_request.head.ref == 'infra/homologacao-local-39' }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'WEB_PORT=3107\nDB_PASSWORD=ci-descartavel-sem-dados-reais-123\n' > .env.homologacao
          chmod 600 .env.homologacao
          cleanup() {
            docker compose --env-file .env.homologacao -f compose.homologacao.yml down --remove-orphans || true
            rm -f .env.homologacao
          }
          trap cleanup EXIT
          docker compose --env-file .env.homologacao -f compose.homologacao.yml config --quiet
          docker compose --env-file .env.homologacao -f compose.homologacao.yml up -d --build --wait
          for tentativa in $(seq 1 40); do
            if curl --fail --silent --show-error --max-time 4 -I http://127.0.0.1:3107/ >/dev/null 2>&1; then
              echo 'Smoke test Next.js via loopback: OK'
              exit 0
            fi
            sleep 3
          done
          echo 'Falha no smoke test do Next.js'
          docker compose --env-file .env.homologacao -f compose.homologacao.yml ps
          docker compose --env-file .env.homologacao -f compose.homologacao.yml logs --tail=80 web
          exit 1

      - name: Testar schema PostgreSQL de homologacao
        # Somente no PR da Issue 41, com banco descartavel do runner.
        if: ${{ github.event.pull_request.head.ref == 'db/schema-homologacao-41' }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'WEB_PORT=3107\nDB_PASSWORD=ci-descartavel-sem-dados-reais-123\n' > .env.homologacao
          chmod 600 .env.homologacao
          cleanup() {
            docker compose --env-file .env.homologacao -f compose.homologacao.yml down --remove-orphans || true
            rm -f .env.homologacao
          }
          trap cleanup EXIT
          docker compose --env-file .env.homologacao -f compose.homologacao.yml config --quiet
          docker compose --env-file .env.homologacao -f compose.homologacao.yml up -d --wait db
          bash scripts/aplicar-schema-homologacao.sh
          bash scripts/aplicar-schema-homologacao.sh
