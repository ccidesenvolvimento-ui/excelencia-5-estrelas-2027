name: Validar pull request

on:
  pull_request:
    branches:
      - main
      - "style/**"
      - "infra/**"
      - "db/**"
      - "auth/**"
      - "feat/**"

permissions:
  contents: read

concurrency:
  group: validar-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validar:
    # Fixar LTS estável; runner pré-configurado com bibliotecas para testes Chromium.
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Verificar TypeScript
        run: npm run typecheck
      - name: Testar regras e exportacao XLSX
        run: npm run test:rules
      - name: Verificar cliente Supabase server-only sem dados reais
        if: ${{ github.event.pull_request.head.ref == 'infra/supabase-cloud-45' }}
        run: node scripts/testar-cliente-supabase-cloud.cjs
      - name: Verificar base de sessao Supabase SSR
        if: ${{ github.event.pull_request.head.ref == 'auth/supabase-ssr-47' }}
        run: node scripts/testar-sessao-supabase-ssr.cjs
      - name: Verificar login Supabase opt-in sem dados reais
        if: ${{ github.event.pull_request.head.ref == 'auth/login-inicial-49' }}
        run: node scripts/testar-login-supabase.cjs
      - name: Verificar controle de rotas e isolamento do proxy
        if: ${{ github.event.pull_request.head.ref == 'auth/protecao-rotas-51' }}
        run: node scripts/testar-protecao-rotas.cjs
      - name: Testar RLS de filiais em PostgreSQL descartavel
        if: ${{ github.event.pull_request.head.ref == 'db/rls-filiais-53' }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'WEB_PORT=3107\nDB_PASSWORD=ci-rls-somente-teste-descartavel-123\n' > .env.homologacao
          chmod 600 .env.homologacao
          cleanup() {
            docker compose --env-file .env.homologacao -f compose.homologacao.yml down --remove-orphans || true
            rm -f .env.homologacao
          }
          trap cleanup EXIT
          docker compose --env-file .env.homologacao -f compose.homologacao.yml up -d --wait db
          bash scripts/aplicar-schema-homologacao.sh
          docker compose --env-file .env.homologacao -f compose.homologacao.yml exec -T db \
            psql -X -U excelencia5_app -d excelencia5_homologacao -v ON_ERROR_STOP=1 \
            < db/homologacao/29_auth_uid_apenas_ci.sql
          docker compose --env-file .env.homologacao -f compose.homologacao.yml exec -T db \
            psql -X -U excelencia5_app -d excelencia5_homologacao -v ON_ERROR_STOP=1 \
            < supabase/migrations/20261106000100_rls_filiais_leitura.sql
          docker compose --env-file .env.homologacao -f compose.homologacao.yml exec -T db \
            psql -X -U excelencia5_app -d excelencia5_homologacao -v ON_ERROR_STOP=1 \
            < db/homologacao/30_testar_rls_filiais.sql

      - name: Testar autorizacao de administradores importadores
        if: ${{ github.event.pull_request.head.ref == 'auth/admin-importacoes-55' }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'WEB_PORT=3107\nDB_PASSWORD=ci-admin-teste-descartavel-123\n' > .env.homologacao
          chmod 600 .env.homologacao
          cleanup() {
            docker compose --env-file .env.homologacao -f compose.homologacao.yml down --remove-orphans || true
            rm -f .env.homologacao
          }
          trap cleanup EXIT
          docker compose --env-file .env.homologacao -f compose.homologacao.yml up -d --wait db
          bash scripts/aplicar-schema-homologacao.sh
          for arquivo in \
            db/homologacao/29_auth_uid_apenas_ci.sql \
            supabase/migrations/20261106000100_rls_filiais_leitura.sql \
            supabase/migrations/20261111000100_admin_importacoes_autorizacao.sql \
            db/homologacao/40_testar_admin_importacoes.sql; do
            docker compose --env-file .env.homologacao -f compose.homologacao.yml exec -T db \
              psql -X -U excelencia5_app -d excelencia5_homologacao -v ON_ERROR_STOP=1 < "$arquivo"
          done

      - name: Testar ajustes administrativos e auditoria em PostgreSQL descartavel
        if: ${{ github.event.pull_request.head.ref == 'feat/ajuste-administrativo-notas-57' }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'WEB_PORT=3107\nDB_PASSWORD=ci-ajustes-descartavel-123\n' > .env.homologacao
          chmod 600 .env.homologacao
          cleanup() {
            docker compose --env-file .env.homologacao -f compose.homologacao.yml down --remove-orphans || true
            rm -f .env.homologacao
          }
          trap cleanup EXIT
          docker compose --env-file .env.homologacao -f compose.homologacao.yml up -d --wait db
          bash scripts/aplicar-schema-homologacao.sh
          for arquivo in \
            db/homologacao/29_auth_uid_apenas_ci.sql \
            supabase/migrations/20261106000100_rls_filiais_leitura.sql \
            supabase/migrations/20261111000100_admin_importacoes_autorizacao.sql \
            supabase/migrations/20261111000200_ajustes_administrativos_notas.sql \
            db/homologacao/41_testar_ajustes_notas.sql; do
            docker compose --env-file .env.homologacao -f compose.homologacao.yml exec -T db \
              psql -X -U excelencia5_app -d excelencia5_homologacao -v ON_ERROR_STOP=1 < "$arquivo"
          done

      - name: Verificar isolamento da API Node de ajustes
        if: ${{ github.event.pull_request.head.ref == 'feat/api-ajustes-notas-61' }}
        run: node scripts/testar-api-ajustes-config.cjs

      - name: Compilar sistema
        run: npm run build
        env:
          NEXT_PUBLIC_DEPLOY_TARGET: github-pages
          NEXT_PUBLIC_BASE_PATH: /excelencia-5-estrelas-2027
      - name: Compilar API de ajustes em Next.js Node descartavel
        if: ${{ github.event.pull_request.head.ref == 'feat/api-ajustes-notas-61' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/app/api/ajustes-notas
          trap 'rm -f src/app/api/ajustes-notas/route.ts; rmdir src/app/api/ajustes-notas src/app/api 2>/dev/null || true' EXIT
          cp src/server/templates/ajustes-notas-route.ts src/app/api/ajustes-notas/route.ts
          npm run build

      - name: Instalar navegador para regressao visual
        run: |
          set -euo pipefail
          # Falhas temporárias de DNS do mirror apt não devem ser confundidas com regressão do sistema.
          npm install --no-save --no-audit --no-fund playwright@1.64.1
          # Evita apt-get/--with-deps: mirrors Ubuntu estão indisponíveis no runner.
          # O Chromium é obtido pelo instalador Playwright; dependências de sistema
          # já disponíveis no runner são verificadas ao iniciar o navegador.
          npx playwright install chromium
      - name: Verificar desktop e celular
        run: |
          node scripts/testar-ajustes-browser.cjs
          node scripts/testar-fundacao-admin-browser.cjs
          npm run test:entrada
          npm run test:cinema
      - name: Salvar evidencias visuais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ajustes-desktop-celular
          path: artifacts/

      - name: Compilar com proxy de autenticacao no Next.js Node
        if: ${{ github.event.pull_request.head.ref == 'auth/protecao-rotas-51' }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f src/proxy.ts' EXIT
          cp src/server/proxy-autenticacao.ts src/proxy.ts
          npm run build

      - name: Validar homologacao Docker e Next.js servidor
        # Executa contêineres efêmeros somente no runner do GitHub, sem acesso ao servidor do setor.
        if: ${{ github.event.pull_request.head.ref == 'infra/homologacao-local-39' }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'WEB_PORT=3107\nDB_PASSWORD=ci-descartavel-sem-dados-reais-123\n' > .env.homologacao
          chmod 600 .env.homologacao
          cleanup() {
            docker compose --env-file .env.homologacao -f compose.homologacao.yml down --remove-orphans || true
            rm -f .env.homologacao
          }
          trap cleanup EXIT
          docker compose --env-file .env.homologacao -f compose.homologacao.yml config --quiet
          docker compose --env-file .env.homologacao -f compose.homologacao.yml up -d --build --wait
          for tentativa in $(seq 1 40); do
            if curl --fail --silent --show-error --max-time 4 -I http://127.0.0.1:3107/ >/dev/null 2>&1; then
              echo 'Smoke test Next.js via loopback: OK'
              exit 0
            fi
            sleep 3
          done
          echo 'Falha no smoke test do Next.js'
          docker compose --env-file .env.homologacao -f compose.homologacao.yml ps
          docker compose --env-file .env.homologacao -f compose.homologacao.yml logs --tail=80 web
          exit 1

      - name: Testar schema PostgreSQL de homologacao
        # Somente no PR da Issue 41, com banco descartavel do runner.
        if: ${{ github.event.pull_request.head.ref == 'db/schema-homologacao-41' }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'WEB_PORT=3107\nDB_PASSWORD=ci-descartavel-sem-dados-reais-123\n' > .env.homologacao
          chmod 600 .env.homologacao
          cleanup() {
            docker compose --env-file .env.homologacao -f compose.homologacao.yml down --remove-orphans || true
            rm -f .env.homologacao
          }
          trap cleanup EXIT
          docker compose --env-file .env.homologacao -f compose.homologacao.yml config --quiet
          docker compose --env-file .env.homologacao -f compose.homologacao.yml up -d --wait db
          bash scripts/aplicar-schema-homologacao.sh
          bash scripts/aplicar-schema-homologacao.sh
