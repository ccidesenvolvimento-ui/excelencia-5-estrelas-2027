
name: Publicar demonstracao no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Verificar TypeScript
        run: npm run typecheck

      - name: Testar regras
        run: npm run test:rules

      - name: Compilar sistema
        run: npm run build
        env:
          NEXT_PUBLIC_DEPLOY_TARGET: github-pages
          NEXT_PUBLIC_BASE_PATH: /excelencia-5-estrelas-2027

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Preparar publicacao
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar sistema
        id: deployment
        uses: actions/deploy-pages@v4
